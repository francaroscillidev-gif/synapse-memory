[project]
name = "synapse-memory"
version = "0.1.0"
description = "Open source, local-first long-term memory engine for AI agents and humans via MCP"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Franca Roscilli", email = "francaroscillidev@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "ai",
    "agents",
    "mcp",
    "model-context-protocol",
    "long-term-memory",
    "sqlite",
    "embeddings",
    "vector-search",
    "local-first",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "cryptography>=42.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/francaroscillidev-gif/synapse-memory"
Documentation = "https://github.com/francaroscillidev-gif/synapse-memory#readme"
Repository = "https://github.com/francaroscillidev-gif/synapse-memory.git"
Issues = "https://github.com/francaroscillidev-gif/synapse-memory/issues"

[project.scripts]
synapse = "synapse_memory.cli:main"
synapse-memory = "synapse_memory.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
