<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0b0f19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Synaptic Electric Gradient -->
    <linearGradient id="synapseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Core Pulse Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Container Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" filter="url(#softShadow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#synapseGradient)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Subtle Neural Grid / Ambient Constellation -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="4,6"/>
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="3,5"/>
    <line x1="76" y1="256" x2="436" y2="256"/>
    <line x1="256" y1="76" x2="256" y2="436"/>
    <polygon points="256,126 368,191 368,321 256,386 144,321 144,191" fill="none"/>
  </g>

  <!-- Central Synaptic Node Cluster (Brain / Memory Core) -->
  <g filter="url(#neonGlow)">
    <!-- Ambient Core Pulse -->
    <circle cx="256" cy="256" r="70" fill="url(#coreGlow)"/>

    <!-- Neural Axon Connectors -->
    <!-- Center to Top -->
    <path d="M256,220 L256,150 L310,110" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M256,150 L202,110" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>

    <!-- Center to Right -->
    <path d="M285,240 L350,220 L400,250" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M350,220 L370,165" fill="none" stroke="url(#synapseGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Center to Bottom-Right -->
    <path d="M280,280 L340,340 L395,330" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M340,340 L330,395" fill="none" stroke="url(#synapseGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Center to Bottom-Left -->
    <path d="M232,280 L172,340 L182,395" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M172,340 L117,330" fill="none" stroke="url(#synapseGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Center to Left -->
    <path d="M227,240 L162,220 L112,250" fill="none" stroke="url(#synapseGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M162,220 L142,165" fill="none" stroke="url(#synapseGradient)" stroke-width="4" stroke-linecap="round"/>

    <!-- Synaptic Central Core Hexagon -->
    <polygon points="256,218 289,237 289,275 256,294 223,275 223,237" fill="#0b0f19" stroke="url(#synapseGradient)" stroke-width="6"/>
    <circle cx="256" cy="256" r="14" fill="#38bdf8"/>

    <!-- Peripheral Synaptic Memory Terminals (Glowing Dots) -->
    <circle cx="310" cy="110" r="9" fill="#22d3ee"/>
    <circle cx="202" cy="110" r="9" fill="#22d3ee"/>
    <circle cx="400" cy="250" r="10" fill="#06b6d4"/>
    <circle cx="370" cy="165" r="7" fill="#38bdf8"/>
    <circle cx="395" cy="330" r="8" fill="#6366f1"/>
    <circle cx="330" cy="395" r="9" fill="#818cf8"/>
    <circle cx="182" cy="395" r="9" fill="#818cf8"/>
    <circle cx="117" cy="330" r="8" fill="#6366f1"/>
    <circle cx="112" cy="250" r="10" fill="#06b6d4"/>
    <circle cx="142" cy="165" r="7" fill="#38bdf8"/>

    <!-- Secondary Satellite Pulse Particles -->
    <circle cx="256" cy="150" r="5" fill="#e0e7ff"/>
    <circle cx="350" cy="220" r="5" fill="#e0e7ff"/>
    <circle cx="340" cy="340" r="5" fill="#e0e7ff"/>
    <circle cx="172" cy="340" r="5" fill="#e0e7ff"/>
    <circle cx="162" cy="220" r="5" fill="#e0e7ff"/>
  </g>
</svg>
