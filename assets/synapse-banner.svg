<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="neonBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Radial Glow behind the icon -->
    <radialGradient id="iconBackglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bannerBg)"/>
  <rect width="1196" height="396" x="2" y="2" rx="18" fill="none" stroke="url(#neonBrand)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Radial Glow Behind Icon -->
  <circle cx="230" cy="200" r="180" fill="url(#iconBackglow)"/>

  <!-- Subtle Constellation Background Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="230" cy="200" r="150" fill="none"/>
    <circle cx="230" cy="200" r="110" fill="none" stroke-dasharray="4,6"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="230" y1="0" x2="230" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="950" y1="0" x2="950" y2="400"/>
  </g>

  <!-- Left: Synapse Icon (Scaled) -->
  <g transform="translate(115, 85) scale(0.45)" filter="url(#glow)">
    <!-- Neural Axon Connectors -->
    <path d="M256,220 L256,150 L310,110" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M256,150 L202,110" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M285,240 L350,220 L400,250" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M350,220 L370,165" fill="none" stroke="url(#neonBrand)" stroke-width="5" stroke-linecap="round"/>
    <path d="M280,280 L340,340 L395,330" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M340,340 L330,395" fill="none" stroke="url(#neonBrand)" stroke-width="5" stroke-linecap="round"/>
    <path d="M232,280 L172,340 L182,395" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M172,340 L117,330" fill="none" stroke="url(#neonBrand)" stroke-width="5" stroke-linecap="round"/>
    <path d="M227,240 L162,220 L112,250" fill="none" stroke="url(#neonBrand)" stroke-width="7" stroke-linecap="round"/>
    <path d="M162,220 L142,165" fill="none" stroke="url(#neonBrand)" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Core Hexagon -->
    <polygon points="256,218 289,237 289,275 256,294 223,275 223,237" fill="#0b0f19" stroke="url(#neonBrand)" stroke-width="8"/>
    <circle cx="256" cy="256" r="16" fill="#38bdf8"/>

    <!-- Memory Terminals -->
    <circle cx="310" cy="110" r="12" fill="#22d3ee"/>
    <circle cx="202" cy="110" r="12" fill="#22d3ee"/>
    <circle cx="400" cy="250" r="14" fill="#06b6d4"/>
    <circle cx="370" cy="165" r="9" fill="#38bdf8"/>
    <circle cx="395" cy="330" r="11" fill="#6366f1"/>
    <circle cx="330" cy="395" r="12" fill="#818cf8"/>
    <circle cx="182" cy="395" r="12" fill="#818cf8"/>
    <circle cx="117" cy="330" r="11" fill="#6366f1"/>
    <circle cx="112" cy="250" r="14" fill="#06b6d4"/>
    <circle cx="142" cy="165" r="9" fill="#38bdf8"/>
  </g>

  <!-- Right: Typography & Brand -->
  <g transform="translate(420, 0)">
    <!-- Badges -->
    <g transform="translate(0, 95)">
      <rect width="112" height="26" rx="6" fill="#083344" stroke="#0e7490" stroke-width="1"/>
      <text x="56" y="17" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">LOCAL-FIRST</text>

      <rect x="122" width="138" height="26" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <text x="191" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MCP COMPATIBLE</text>

      <rect x="270" width="85" height="26" rx="6" fill="#064e3b" stroke="#047857" stroke-width="1"/>
      <text x="312" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AES-256</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="185" fill="url(#neonBrand)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">SYNAPSE MEMORY</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="235" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Autonomous Cognitive Memory Engine for AI Agents &amp; Humans</text>

    <text x="0" y="275" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Multi-Tier Architecture • Zero-Knowledge Crypto • SQLite FTS5 + ONNX Hybrid Search • Obsidian Graph</text>

    <!-- Author Badge -->
    <g transform="translate(0, 310)">
      <circle cx="10" cy="10" r="5" fill="#10b981"/>
      <text x="24" y="14" fill="#6b7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Developed &amp; Maintained by <tspan fill="#e5e7eb" font-weight="600">Franca Roscilli (@francaroscillidev-gif)</tspan></text>
    </g>
  </g>
</svg>
